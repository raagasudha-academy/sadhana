name: Quality checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Production operation (only applies on main)
        required: true
        type: choice
        default: none
        options:
          - none
          - portal
          - backend-bootstrap
          - cognito-v2
          - sruti-intake
      phase:
        description: Sruti intake phase (used only for sruti-intake)
        required: false
        type: choice
        default: enable-intake
        options:
          - enable-intake
          - activate-sadhana-reads
          - enable-raaga-parent-action-reads
          - enable-raaga-parent-invitations
          - enable-raaga-import-execution
          - enable-raaga-review-writes
      test_registration_id:
        description: Required only for activate-sadhana-reads; use a verified synthetic prod submission ID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sadhana-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Restore Playwright browser cache
        if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser for frontend E2E
        if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
        run: npx playwright install chromium
      - name: Run frontend browser tests
        if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
        run: npm run test:frontend:playwright

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Run backend E2E tests
        if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
        run: npm run test:e2e
      - name: Package Lambda code
        run: |
          mkdir -p "$RUNNER_TEMP/sadhana-lambda"
          cp dist/lambda.mjs "$RUNNER_TEMP/sadhana-lambda/lambda.mjs"
          (cd "$RUNNER_TEMP/sadhana-lambda" && zip -q lambda.zip lambda.mjs)
      - uses: actions/upload-artifact@v4
        with:
          name: sadhana-lambda
          path: ${{ runner.temp }}/sadhana-lambda/lambda.zip
          retention-days: 1

  python-helpers:
    name: Verify Python helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install helper dependency
        run: python -m pip install boto3
      - name: Run Python helper tests
        run: python -m unittest discover -s backend/test -p 'test_*.py'

  deploy-dev:
    needs: [frontend, backend, python-helpers]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: sadhana-dev-portal-pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require dev runtime configuration
        env:
          ISSUER: ${{ vars.VITE_SADHANA_COGNITO_ISSUER }}
          CLIENT_ID: ${{ vars.VITE_SADHANA_COGNITO_CLIENT_ID }}
          DOMAIN: ${{ vars.VITE_SADHANA_COGNITO_DOMAIN }}
          API_URL: ${{ vars.VITE_SADHANA_API_URL }}
        run: |
          for value in "$ISSUER" "$CLIENT_ID" "$DOMAIN" "$API_URL"; do
            if [ -z "$value" ]; then echo 'Missing dev Cognito/API GitHub Actions variable'; exit 1; fi
          done
      - name: Build dev portal
        env:
          VITE_SADHANA_COGNITO_ISSUER: ${{ vars.VITE_SADHANA_COGNITO_ISSUER }}
          VITE_SADHANA_COGNITO_CLIENT_ID: ${{ vars.VITE_SADHANA_COGNITO_CLIENT_ID }}
          VITE_SADHANA_COGNITO_DOMAIN: ${{ vars.VITE_SADHANA_COGNITO_DOMAIN }}
          VITE_SADHANA_API_URL: ${{ vars.VITE_SADHANA_API_URL }}
        run: |
          export VITE_BASE_PATH='/'
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  deploy-dev-api:
    needs: [frontend, backend, python-helpers]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-pages
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: sadhana-dev-api
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sadhana-lambda
          path: ./lambda-package
      - name: Check dev deployment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_CODE_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_ROLE_ARN" || { echo 'Missing github-pages variable AWS_CODE_DEPLOY_ROLE_ARN'; exit 1; }
          test "$AWS_ROLE_ARN" = 'arn:aws:iam::627821644317:role/sadhana-github-dev-code-deploy' || { echo 'Unexpected dev Lambda code deployment role'; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CODE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify AWS account and dev Lambda
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = 627821644317
          aws lambda get-function-configuration --function-name dev-sadhana-api --region us-east-1 \
            --query 'FunctionName' --output text | grep -Fx dev-sadhana-api
      - name: Deploy dev Lambda code only
        run: |
          expected="$(openssl dgst -sha256 -binary ./lambda-package/lambda.zip | openssl base64 -A)"
          aws lambda update-function-code --function-name dev-sadhana-api --region us-east-1 \
            --zip-file fileb://./lambda-package/lambda.zip >/dev/null
          aws lambda wait function-updated --function-name dev-sadhana-api --region us-east-1
          actual="$(aws lambda get-function-configuration --function-name dev-sadhana-api --region us-east-1 --query CodeSha256 --output text)"
          test "$actual" = "$expected" || { echo 'Deployed Lambda hash does not match the verified artifact'; exit 1; }

  production-portal:
    needs: [frontend, backend, python-helpers, deploy-dev, deploy-dev-api]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'portal'))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/prod-portal-deploy.yml
    secrets: inherit

  production-backend-bootstrap:
    needs: [frontend, backend, python-helpers, deploy-dev, deploy-dev-api]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'backend-bootstrap'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/prod-backend-bootstrap.yml
    secrets: inherit

  production-cognito-v2:
    needs: [frontend, backend, python-helpers, deploy-dev, deploy-dev-api]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'cognito-v2'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/prod-cognito-v2-bootstrap.yml
    secrets: inherit

  production-sruti-intake:
    needs: [frontend, backend, python-helpers, deploy-dev, deploy-dev-api]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'sruti-intake'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/prod-sruti-intake-release.yml
    with:
      phase: ${{ inputs.phase }}
      test_registration_id: ${{ inputs.test_registration_id }}
    secrets: inherit
