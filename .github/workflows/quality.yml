name: Quality checks
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify
      - name: Install browser for frontend E2E
        run: npx playwright install chromium
      - name: Run frontend browser tests
        run: npm run test:frontend:playwright
      - name: Run Python helper tests
        run: |
          python -m pip install boto3
          npm run test:python
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:e2e
