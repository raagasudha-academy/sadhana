name: Sadhana production deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Production operation to run
        type: choice
        required: true
        options:
          - backend-bootstrap
          - cognito-v2
          - portal
          - sruti-intake
      phase:
        description: Sruti intake phase (used only for sruti-intake)
        type: choice
        required: false
        default: enable-intake
        options:
          - enable-intake
          - activate-sadhana-reads
          - enable-raaga-parent-action-reads
          - enable-raaga-parent-invitations
          - enable-raaga-import-execution
          - enable-raaga-review-writes
      test_registration_id:
        description: Required only for activate-sadhana-reads; use a verified synthetic prod submission ID
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: sadhana-production-release
  cancel-in-progress: false

jobs:
  verify-frontend:
    name: Verify frontend
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Require production release from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Production deployments can only be dispatched from main.'
            exit 1
          fi
      - run: npm ci
      - name: Frontend checks, unit tests, and build
        run: npm run verify
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for frontend browser checks
        run: npx playwright install chromium
      - name: Frontend browser tests
        run: npm run test:frontend:playwright
      - name: Validate production table naming for backend bootstrap
        if: inputs.target == 'backend-bootstrap'
        run: |
          node --input-type=module <<'NODE'
          import { makeProductionEntityTablesTemplate } from './backend/scripts/prodEntityTablesTemplate.mjs';
          const template = makeProductionEntityTablesTemplate('prod');
          const names = Object.values(template.Resources).map((resource) => resource.Properties.TableName);
          const prefixes = ['prod-sadhana-', 'prod-sruti-', 'prod-raagasudha-'];
          const invalid = names.find((name) => !prefixes.some((prefix) => name.startsWith(prefix)));
          if (names.length !== 20) throw new Error(`Expected 20 production tables, found ${names.length}.`);
          if (invalid) throw new Error(`Unexpected non-production-prefixed table name: ${invalid}`);
          console.log(`Validated ${names.length} production-prefixed tables.`);
          NODE

  verify-backend:
    name: Verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Require production release from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Production deployments can only be dispatched from main.'
            exit 1
          fi
      - run: npm ci
      - name: Backend checks, unit tests, and build
        run: npm run check && npm run build
      - name: Backend HTTP end-to-end tests
        run: npm run test:e2e

  verify-python-helpers:
    name: Verify Python helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install helper dependency
        run: python -m pip install boto3
      - name: Run Python helper tests
        run: python -m unittest discover -s backend/test -p 'test_*.py'

  backend-bootstrap:
    needs: [verify-frontend, verify-backend, verify-python-helpers]
    if: inputs.target == 'backend-bootstrap'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/prod-backend-bootstrap.yml
    secrets: inherit

  cognito-v2:
    needs: [verify-frontend, verify-backend, verify-python-helpers]
    if: inputs.target == 'cognito-v2'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/prod-cognito-v2-bootstrap.yml
    secrets: inherit

  portal:
    needs: [verify-frontend, verify-backend, verify-python-helpers]
    if: inputs.target == 'portal'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/prod-portal-deploy.yml
    secrets: inherit

  sruti-intake:
    needs: [verify-frontend, verify-backend, verify-python-helpers]
    if: inputs.target == 'sruti-intake'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/prod-sruti-intake-release.yml
    with:
      phase: ${{ inputs.phase }}
      test_registration_id: ${{ inputs.test_registration_id }}
    secrets: inherit
