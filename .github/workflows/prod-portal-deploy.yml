name: Sadhana production portal release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sadhana-production-portal
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix backend
      - name: Require main branch release
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Production releases must be dispatched from main.'
            exit 1
          fi
      - name: Run frontend checks, unit tests, and build
        run: npm run verify
      - name: Install Chromium for frontend E2E
        run: npx playwright install chromium
      - name: Run frontend browser tests
        run: npm run test:frontend:playwright
      - name: Run backend checks, unit tests, and build
        run: npm run verify:backend
      - name: Run backend HTTP E2E tests
        run: npm run test:backend:e2e
      - name: Run Python helper tests
        run: |
          python -m pip install boto3
          npm run test:python
      - name: Check production cutover readiness
        run: npm run check:prod:readiness

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check production configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          PORTAL_BUCKET: ${{ vars.PROD_PORTAL_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.PROD_CLOUDFRONT_DISTRIBUTION_ID }}
          COGNITO_ISSUER: ${{ vars.VITE_SADHANA_COGNITO_ISSUER }}
          COGNITO_CLIENT_ID: ${{ vars.VITE_SADHANA_COGNITO_CLIENT_ID }}
          COGNITO_DOMAIN: ${{ vars.VITE_SADHANA_COGNITO_DOMAIN }}
          API_URL: ${{ vars.VITE_SADHANA_API_URL }}
        run: |
          for value in "$AWS_ROLE_ARN" "$AWS_REGION" "$PORTAL_BUCKET" "$DISTRIBUTION_ID" "$COGNITO_ISSUER" "$COGNITO_CLIENT_ID" "$COGNITO_DOMAIN" "$API_URL"; do
            if [ -z "$value" ]; then
              echo 'Missing production portal GitHub environment variable'
              exit 1
            fi
          done
          case "$API_URL" in
            https://*) ;;
            *) echo 'Production API URL must use HTTPS'; exit 1 ;;
          esac
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build production portal
        env:
          VITE_BASE_PATH: /
          VITE_SADHANA_COGNITO_ISSUER: ${{ vars.VITE_SADHANA_COGNITO_ISSUER }}
          VITE_SADHANA_COGNITO_CLIENT_ID: ${{ vars.VITE_SADHANA_COGNITO_CLIENT_ID }}
          VITE_SADHANA_COGNITO_DOMAIN: ${{ vars.VITE_SADHANA_COGNITO_DOMAIN }}
          VITE_SADHANA_API_URL: ${{ vars.VITE_SADHANA_API_URL }}
        run: npm run build
      - name: Upload portal build
        env:
          PORTAL_BUCKET: ${{ vars.PROD_PORTAL_BUCKET }}
        run: aws s3 sync dist/ "s3://${PORTAL_BUCKET}" --delete --no-progress
      - name: Refresh CloudFront
        env:
          DISTRIBUTION_ID: ${{ vars.PROD_CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
