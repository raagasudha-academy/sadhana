<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Sadhana visual regression fixtures</title><style>body{margin:0;background:#f4f5f8;color:#1d2939;font:15px system-ui,Arial,sans-serif}.fixture-shell{max-width:1050px;margin:36px auto;padding:30px;background:white;border:1px solid #dde2eb;border-radius:16px;box-shadow:0 8px 35px #162d4910}h1{margin:0 0 4px;font-size:27px}header p{color:#667085;margin-top:3px}.fixture-controls{display:flex;align-items:end;flex-wrap:wrap;gap:13px;margin:26px 0 14px;padding:16px;border-radius:10px;background:#f8fafc}.fixture-controls label{display:grid;gap:6px;font-size:12px;color:#475467}select,button,summary{font:inherit;padding:8px 10px;border:1px solid #d0d5dd;border-radius:7px;background:white;color:#344054;cursor:pointer}.fixture-controls button{align-self:end}output{display:block;margin:10px 0;color:#475467}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;border-bottom:1px solid #eaecf0;padding:12px}th{background:#f9fafb;color:#475467;font-size:13px}.reg-card-badges{display:flex;gap:5px;align-items:center}.reg-card-badges span{border-radius:30px;padding:4px 9px;background:#eaf2ff;color:#174c85;font-size:12px}.reg-card-badges .is-archived{background:#f2f4f7;color:#475467}.reg-data-menu{position:relative;align-self:end}.reg-data-menu-options{position:absolute;background:white;box-shadow:0 6px 18px #0002;z-index:1;min-width:185px;padding:5px;right:0}.reg-data-menu-options button{display:flex;width:100%;gap:5px;border:0;text-align:left}h2{font-size:20px}</style></head><body><div id="root"></div><script type="module" src="./visual.tsx"></script></body></html>
