AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Sadhana DynamoDB foundation and protected API. NOT a completed production portal.
  Deploy only after configuring an invitation-only Cognito user pool and its app client.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  CognitoUserPoolId:
    Type: String
    Description: Existing Sadhana staff Cognito User Pool ID in the deployment region
  SadhanaSuperAdminSub:
    Type: String
    Default: ''
    Description: Cognito sub of the trusted Sadhana super-admin; blank disables admin account changes
  CognitoAppClientId:
    Type: String
    Description: Existing Sadhana staff Cognito app client ID
  AllowedPortalOrigins:
    Type: CommaDelimitedList
    Description: Required exact comma-separated browser origins for this stage; no paths or wildcard origins. Dev may include localhost. Production must include both production portal origins.
  MiddlesbroughCredentialParameter:
    Type: String
    Description: Required stage-specific SSM SecureString name holding the dedicated Google service account JSON (never passed in template)
  EnablePointInTimeRecovery:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set true for production after reviewing backup/restore requirements and additional cost

Conditions:
  UsePitr: !Equals [!Ref EnablePointInTimeRecovery, 'true']
  CreateAggregateTable: !Not [!Equals [!Ref Stage, prod]]
  UseProdLambdaBoundary: !Equals [!Ref Stage, prod]

Mappings:
  StageTables:
    dev:
      SrutiSource: dev-sruti-student-registrations
    staging:
      SrutiSource: staging-sruti-student-registrations
    prod:
      SrutiSource: prod-sruti-student-registrations

Resources:
  SadhanaHomeworkMedia:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${Stage}-sadhana-homework-media-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: Sadhana
        - Key: Environment
          Value: !Ref Stage
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedPortalOrigins
            AllowedMethods:
              - GET
              - HEAD
              - PUT
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: CleanupIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  SadhanaTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateAggregateTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Stage}-sadhana-main
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [UsePitr, true, false]
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  SadhanaProfilePhotos:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${Stage}-sadhana-profile-photos-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: Sadhana
        - Key: Environment
          Value: !Ref Stage

  SadhanaApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub '${Stage}-sadhana-api'
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: !Ref AllowedPortalOrigins
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoStaff
        Authorizers:
          CognitoStaff:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}
              audience: [!Ref CognitoAppClientId]

  SadhanaApiLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda.ts
        Target: es2022
        Platform: node
        Format: cjs
        Minify: false
        Sourcemap: false
    Properties:
      FunctionName: !Sub '${Stage}-sadhana-api'
      Runtime: nodejs22.x
      Handler: src/lambda.handler

      CodeUri: ../backend/
      Timeout: 30
      MemorySize: 256
      PermissionsBoundary: !If
        - UseProdLambdaBoundary
        - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/SadhanaProdLambdaBoundary'
        - !Ref AWS::NoValue
      PropagateTags: true
      Tags:
        Project: Sadhana
        Environment: !Ref Stage
      Environment:
        Variables:
          SADHANA_TABLE_NAME: !If
            - CreateAggregateTable
            - !Ref SadhanaTable
            - !Sub '${Stage}-sadhana-main'
          SADHANA_ENTITY_STAGE: !Ref Stage
          SRUTI_SOURCE_REGISTRATIONS_TABLE: !FindInMap [StageTables, !Ref Stage, SrutiSource]
          SADHANA_COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          SADHANA_SUPER_ADMIN_SUB: !Ref SadhanaSuperAdminSub
          SADHANA_ENTITY_TABLE_SET: final
          SADHANA_ENTITY_FINAL_ACK: enabled
          SADHANA_DATA_MODE: final
          SADHANA_PROFILE_PHOTOS_BUCKET: !Ref SadhanaProfilePhotos
          MIDDLESBROUGH_CREDENTIAL_PARAMETER: !Ref MiddlesbroughCredentialParameter
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:ConditionCheckItem
              Resource:
                - !If
                  - CreateAggregateTable
                  - !GetAtt SadhanaTable.Arn
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Stage}-sadhana-main'
                - !If
                  - CreateAggregateTable
                  - !Sub '${SadhanaTable.Arn}/index/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Stage}-sadhana-main/index/*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Stage}-sadhana-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Stage}-sadhana-*/index/*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:ConditionCheckItem
              Resource:
                - !Sub
                  - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SourceTable}'
                  - SourceTable: !FindInMap [StageTables, !Ref Stage, SrutiSource]
                - !Sub
                  - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SourceTable}/index/*'
                  - SourceTable: !FindInMap [StageTables, !Ref Stage, SrutiSource]
            - Effect: Allow
              Action:
                - cognito-idp:ListUsersInGroup
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:ListUsers
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub '${SadhanaProfilePhotos.Arn}/profiles/*'
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !GetAtt SadhanaProfilePhotos.Arn
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MiddlesbroughCredentialParameter}'
      Events:
        ProtectedRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref SadhanaApi
            Path: /api/{proxy+}
            Method: ANY
        # Browsers send OPTIONS without an Authorization header. This more
        # specific method overrides the authenticated ANY route for preflight.
        CorsPreflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref SadhanaApi
            Path: /api/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE

Outputs:
  ApiUrl:
    Description: Cognito-protected API base URL; NOT PUBLIC DATA ACCESS
    Value: !Sub https://${SadhanaApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api
  TableName:
    Value: !If [CreateAggregateTable, !Ref SadhanaTable, !Sub '${Stage}-sadhana-main']
