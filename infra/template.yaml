AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Sadhana DynamoDB foundation and protected API. NOT a completed production portal.
  Deploy only after configuring an invitation-only Cognito user pool and its app client.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  CognitoUserPoolId:
    Type: String
    Description: Existing Sadhana staff Cognito User Pool ID in the deployment region
  SadhanaSuperAdminSub:
    Type: String
    Default: ''
    Description: Cognito sub of the trusted Sadhana super-admin; blank disables admin account changes
  CognitoAppClientId:
    Type: String
    Description: Existing Sadhana staff Cognito app client ID
  CognitoEmailUsernameMode:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Set enabled only while the configured Cognito pool uses email as its sign-in username; alias-based pools should leave this disabled.
  AllowedPortalOrigins:
    Type: CommaDelimitedList
    Description: Required exact comma-separated browser origins for this stage; no paths or wildcard origins. Dev may include localhost. Production must include both production portal origins.
  MiddlesbroughCredentialParameter:
    Type: String
    Description: Required stage-specific SSM SecureString name holding the dedicated Google service account JSON (never passed in template)
  EnablePointInTimeRecovery:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Set true for production after reviewing backup/restore requirements and additional cost
  FinalCoreWrites:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable authenticated, institution-scoped writes for final core records such as families, students, enrolments and teachers
  FinalVenueWrites:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable administrator venue create and edit operations in canonical final tables
  FinalTeacherLifecycleWrites:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable separately audited administrator teacher activation, archive and restore operations
  FinalCalendarWrites:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable final-table calendar and class schedule writes
  FinalSeriesWrites:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable final-table recurring schedule series changes
  FinalEventWrites:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable final-table managed event create, edit and cancel operations
  FinalLearnerReads:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable the identity- and family-link-scoped final learner dashboard read
  FinalLearnerWrites:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable identity- and enrolment-scoped final learner practice and RSVP writes
  FinalLearnerExtrasReads:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable the identity- and family-link-scoped learner extras and class details read
  FinalLearnerDirectoryReads:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable the learner's institution-scoped public academy directory read
  FinalLearnerPreferencesParity:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Confirm legacy learner preference records were reconciled into canonical people records
  FinalHomeworkReads:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable identity- and enrolment-scoped learner and staff homework reads
  FinalHomeworkWrites:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable identity- and enrolment-scoped learner submissions and staff homework changes
  FinalLearnerMedia:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable learner media upload and access through verified private S3 receipts
  FinalHomeworkMedia:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable private homework material uploads and downloads
  FinalTeacherPracticeReads:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable teacher reads of learner practice and media
  FinalTeacherPracticeWrites:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable teacher feedback writes on learner practice
  SrutiIngressReady:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable only after verifying the stage-specific Sruti intake writer and destination table
  SrutiRegistrationReads:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable the authenticated Sruti registration list/detail API after the intake target is verified
  SrutiReviewWrites:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable institution-scoped approval or rejection of pending Sruti website submissions; does not import students or grant parent access
  SrutiImportWrites:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable importing reviewed Sruti registrations into canonical student and family records
  SrutiParentInvitations:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable explicitly confirmed invitations for Sruti parent accounts
  SrutiParentResends:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable explicitly confirmed resends of Sruti parent invitations
  RaagaIntakeReads:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable authenticated Raagasudha registration list/detail reads after its stage-specific intake target is verified
  RaagaReviewWrites:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable authenticated admin approval or discard of Raagasudha website registrations
  RaagaParentStatusReads:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable the admin-only read of canonical Raagasudha parent-account status markers
  RaagaParentActionReads:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable canonical Raagasudha parent-account actions after identity reconciliation
  RaagaParentInvitations:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Allow an explicitly confirmed admin action to invite a new Raagasudha parent account
  RaagaParentResends:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Allow an explicitly confirmed admin action to resend a Raagasudha parent invitation
  RaagaParentLinkWrites:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Allow an explicitly confirmed admin action to link an existing verified parent account
  RaagaImportPreview:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable read-only previews of approved Raagasudha registrations without permitting import execution
  RaagaImportWrites:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Enable exact-reference confirmed imports of approved Raagasudha registrations
  RaagaIdentityReconciled:
    Type: String
    Default: disabled
    AllowedValues: [enabled, disabled]
    Description: Acknowledge completion of the Raagasudha historical identity reconciliation

Conditions:
  UsePitr: !Equals [!Ref EnablePointInTimeRecovery, 'true']
  CreateAggregateTable: !Not [!Equals [!Ref Stage, prod]]
  UseProdLambdaBoundary: !Equals [!Ref Stage, prod]
  UseDevFamilyReads: !Equals [!Ref Stage, dev]
  UseFamilyReads: !Not [!Equals [!Ref Stage, staging]]
  UseRaagaApi: !Not [!Equals [!Ref Stage, staging]]

Mappings:
  StageTables:
    dev:
      SrutiSource: dev-sruti-student-registrations
      SrutiRegistration: dev-sruti-student-registrations
      RaagasudhaApiId: ruaignd57e
    staging:
      SrutiSource: staging-sruti-student-registrations
      SrutiRegistration: staging-sruti-student-registrations
      RaagasudhaApiId: unused
    prod:
      SrutiSource: prod-sruti-student-registrations
      SrutiRegistration: prod-sruti-student-registrations
      RaagasudhaApiId: yaug86x7o0

Resources:
  SadhanaHomeworkMedia:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${Stage}-sadhana-homework-media-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: Sadhana
        - Key: Environment
          Value: !Ref Stage
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedPortalOrigins
            AllowedMethods:
              - GET
              - HEAD
              - PUT
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: CleanupIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  SadhanaTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateAggregateTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub ${Stage}-sadhana-main
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [UsePitr, true, false]
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  SadhanaProfilePhotos:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${Stage}-sadhana-profile-photos-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: Sadhana
        - Key: Environment
          Value: !Ref Stage

  SadhanaApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub '${Stage}-sadhana-api'
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: !Ref AllowedPortalOrigins
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        MaxAge: 600
      RouteSettings:
        'POST /api/auth/{proxy+}':
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5
      Auth:
        DefaultAuthorizer: CognitoStaff
        Authorizers:
          CognitoStaff:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}
              audience: [!Ref CognitoAppClientId]

  SadhanaApiLambda:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/lambda.ts
        Target: es2022
        Platform: node
        Format: cjs
        Minify: false
        Sourcemap: false
    Properties:
      FunctionName: !Sub '${Stage}-sadhana-api'
      Runtime: nodejs22.x
      Handler: src/lambda.handler

      CodeUri: ../backend/
      Timeout: 30
      MemorySize: 256
      PermissionsBoundary: !If
        - UseProdLambdaBoundary
        - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/SadhanaProdLambdaBoundary'
        - !Ref AWS::NoValue
      PropagateTags: true
      Tags:
        Project: Sadhana
        Environment: !Ref Stage
      Environment:
        Variables:
          SADHANA_TABLE_NAME: !If
            - CreateAggregateTable
            - !Ref SadhanaTable
            - !Sub '${Stage}-sadhana-main'
          SADHANA_ENTITY_STAGE: !Ref Stage
          SRUTI_SOURCE_REGISTRATIONS_TABLE: !FindInMap [StageTables, !Ref Stage, SrutiSource]
          SRUTI_REGISTRATIONS_TABLE: !FindInMap [StageTables, !Ref Stage, SrutiRegistration]
          RAAGASUDHA_REGISTRATIONS_API_URL: !If
            - UseRaagaApi
            - !Sub
              - 'https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/'
              - ApiId: !FindInMap [StageTables, !Ref Stage, RaagasudhaApiId]
            - !Ref AWS::NoValue
          SADHANA_COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          SADHANA_COGNITO_APP_CLIENT_ID: !Ref CognitoAppClientId
          SADHANA_COGNITO_EMAIL_USERNAME: !Ref CognitoEmailUsernameMode
          SADHANA_SUPER_ADMIN_SUB: !Ref SadhanaSuperAdminSub
          SADHANA_ALLOWED_PORTAL_ORIGINS: !Join [',', !Ref AllowedPortalOrigins]
          SADHANA_FINAL_TEACHER_LOOKUP_TABLE: !Sub '${Stage}-sadhana-people'
          SADHANA_ENTITY_TABLE_SET: final
          SADHANA_ENTITY_FINAL_ACK: enabled
          SADHANA_DATA_MODE: final
          SADHANA_FINAL_CORE_WRITES: !Ref FinalCoreWrites
          SADHANA_FINAL_VENUE_WRITES: !If [UseDevFamilyReads, enabled, !Ref FinalVenueWrites]
          SADHANA_FINAL_TEACHER_LIFECYCLE_WRITES:
            !If [UseDevFamilyReads, enabled, !Ref FinalTeacherLifecycleWrites]
          SADHANA_FINAL_CALENDAR_WRITES: !If [UseDevFamilyReads, enabled, !Ref FinalCalendarWrites]
          SADHANA_FINAL_SERIES_WRITES: !If [UseDevFamilyReads, enabled, !Ref FinalSeriesWrites]
          SADHANA_FINAL_EVENT_WRITES: !If [UseDevFamilyReads, enabled, !Ref FinalEventWrites]
          SADHANA_FINAL_LEARNER_READS: !If [UseDevFamilyReads, enabled, !Ref FinalLearnerReads]
          SADHANA_FINAL_LEARNER_WRITES: !If [UseDevFamilyReads, enabled, !Ref FinalLearnerWrites]
          SADHANA_FINAL_LEARNER_EXTRAS_READS:
            !If [UseDevFamilyReads, enabled, !Ref FinalLearnerExtrasReads]
          SADHANA_FINAL_LEARNER_DIRECTORY_READS:
            !If [UseDevFamilyReads, enabled, !Ref FinalLearnerDirectoryReads]
          SADHANA_FINAL_LEARNER_PREFERENCES_PARITY:
            !If [UseDevFamilyReads, enabled, !Ref FinalLearnerPreferencesParity]
          SADHANA_FINAL_HOMEWORK_READS: !If [UseDevFamilyReads, enabled, !Ref FinalHomeworkReads]
          SADHANA_FINAL_HOMEWORK_WRITES: !If [UseDevFamilyReads, enabled, !Ref FinalHomeworkWrites]
          SADHANA_FINAL_LEARNER_MEDIA: !If [UseDevFamilyReads, enabled, !Ref FinalLearnerMedia]
          SADHANA_FINAL_HOMEWORK_MEDIA: !If [UseDevFamilyReads, enabled, !Ref FinalHomeworkMedia]
          SADHANA_FINAL_TEACHER_PRACTICE_READS:
            !If [UseDevFamilyReads, enabled, !Ref FinalTeacherPracticeReads]
          SADHANA_FINAL_TEACHER_PRACTICE_WRITES:
            !If [UseDevFamilyReads, enabled, !Ref FinalTeacherPracticeWrites]
          SADHANA_LEARNER_MEDIA_BUCKET: !Ref SadhanaHomeworkMedia
          SADHANA_FINAL_FAMILY_READS: !If [UseFamilyReads, enabled, disabled]
          SADHANA_FINAL_SRUTI_INGRESS_READY:
            !If [UseDevFamilyReads, enabled, !Ref SrutiIngressReady]
          SADHANA_FINAL_SRUTI_REGISTRATION_READS:
            !If [UseDevFamilyReads, enabled, !Ref SrutiRegistrationReads]
          SADHANA_FINAL_SRUTI_REVIEW_WRITES: !Ref SrutiReviewWrites
          SRUTI_REVIEW_WRITES: !Ref SrutiReviewWrites
          SADHANA_FINAL_SRUTI_IMPORT_WRITES: !If [UseDevFamilyReads, enabled, !Ref SrutiImportWrites]
          SRUTI_IMPORT_WRITES: !If [UseDevFamilyReads, enabled, !Ref SrutiImportWrites]
          SADHANA_FINAL_SRUTI_PARENT_INVITATIONS:
            !If [UseDevFamilyReads, enabled, !Ref SrutiParentInvitations]
          SADHANA_FINAL_SRUTI_PARENT_RESENDS:
            !If [UseDevFamilyReads, enabled, !Ref SrutiParentResends]
          SADHANA_FINAL_RAAGA_INTAKE_READS: !If [UseDevFamilyReads, enabled, !Ref RaagaIntakeReads]
          SADHANA_FINAL_RAAGA_REVIEW_WRITES: !Ref RaagaReviewWrites
          SADHANA_FINAL_RAAGA_PARENT_STATUS_READS:
            !If [UseDevFamilyReads, enabled, !Ref RaagaParentStatusReads]
          SADHANA_FINAL_RAAGA_PARENT_ACTION_READS:
            !If [UseDevFamilyReads, enabled, !Ref RaagaParentActionReads]
          SADHANA_FINAL_RAAGA_PARENT_INVITATIONS: !Ref RaagaParentInvitations
          SADHANA_FINAL_RAAGA_PARENT_RESENDS: !Ref RaagaParentResends
          SADHANA_FINAL_RAAGA_PARENT_LINK_WRITES: !Ref RaagaParentLinkWrites
          SADHANA_FINAL_RAAGA_IMPORT_PREVIEW: !Ref RaagaImportPreview
          SADHANA_FINAL_RAAGA_IMPORT_WRITES: !Ref RaagaImportWrites
          SADHANA_FINAL_RAAGA_IDENTITY_RECONCILED: !Ref RaagaIdentityReconciled
          SADHANA_FINAL_ADMIN_READS:
            !If [
              UseProdLambdaBoundary,
              enabled,
              !If [UseDevFamilyReads, enabled, !Ref AWS::NoValue],
            ]
          SADHANA_FINAL_GUARDIAN_QUEUE_READS:
            !If [
              UseProdLambdaBoundary,
              enabled,
              !If [UseDevFamilyReads, enabled, !Ref AWS::NoValue],
            ]
          SADHANA_PROFILE_PHOTOS_BUCKET: !Ref SadhanaProfilePhotos
          MIDDLESBROUGH_CREDENTIAL_PARAMETER: !Ref MiddlesbroughCredentialParameter
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:PutItem
                - dynamodb:BatchWriteItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:ConditionCheckItem
                - dynamodb:TransactWriteItems
              Resource:
                - !If
                  - CreateAggregateTable
                  - !GetAtt SadhanaTable.Arn
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Stage}-sadhana-main'
                - !If
                  - CreateAggregateTable
                  - !Sub '${SadhanaTable.Arn}/index/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Stage}-sadhana-main/index/*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Stage}-sadhana-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Stage}-sadhana-*/index/*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:UpdateItem
                - dynamodb:ConditionCheckItem
              Resource:
                - !Sub
                  - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SourceTable}'
                  - SourceTable: !FindInMap [StageTables, !Ref Stage, SrutiSource]
                - !Sub
                  - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SourceTable}/index/*'
                  - SourceTable: !FindInMap [StageTables, !Ref Stage, SrutiSource]
            - !If
              - UseRaagaApi
              - Effect: Allow
                Action: [execute-api:Invoke]
                Resource:
                  - !Sub
                    - 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/$default/GET/admin/registrations*'
                    - ApiId: !FindInMap [StageTables, !Ref Stage, RaagasudhaApiId]
                  - !Sub
                    - 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiId}/$default/PATCH/admin/registrations/*'
                    - ApiId: !FindInMap [StageTables, !Ref Stage, RaagasudhaApiId]
              - !Ref AWS::NoValue
            - Effect: Allow
              Action:
                - cognito-idp:ListUsersInGroup
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:ListUsers
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminRespondToAuthChallenge
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}'
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub '${SadhanaProfilePhotos.Arn}/profiles/*'
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub '${SadhanaHomeworkMedia.Arn}/homework-private/*'
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !GetAtt SadhanaProfilePhotos.Arn
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MiddlesbroughCredentialParameter}'
      Events:
        ProtectedRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref SadhanaApi
            Path: /api/{proxy+}
            Method: ANY
        # Keep preflight unauthenticated and let the Lambda return CORS headers
        # for the exact allowlisted origin before the browser sends a JWT.
        CorsPreflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref SadhanaApi
            Path: /api/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        PublicEmailAuth:
          Type: HttpApi
          Properties:
            ApiId: !Ref SadhanaApi
            Path: /api/auth/{proxy+}
            Method: POST
            Auth:
              Authorizer: NONE

Outputs:
  ApiUrl:
    Description: Cognito-protected API base URL; NOT PUBLIC DATA ACCESS
    Value: !Sub https://${SadhanaApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api
  TableName:
    Value: !If [CreateAggregateTable, !Ref SadhanaTable, !Sub '${Stage}-sadhana-main']
