AWSTemplateFormatVersion: '2010-09-09'
Description: 'Stage-isolated Sruti public registration intake: standalone API, rate limits, WAF and restricted DynamoDB writes'
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  IntakeEnabled:
    Type: String
    Default: disabled
    AllowedValues: [disabled, enabled]
  SourceTableName:
    Type: String
    Default: dev-sruti-student-registrations
Conditions:
  UseProdLambdaBoundary: !Equals [!Ref Stage, prod]
Resources:
  IntakeRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If
        - UseProdLambdaBoundary
        - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/SrutiProdIntakeBoundary'
        - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: Sadhana
        - Key: Environment
          Value: !Ref Stage
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SrutiIntakePutOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${SourceTableName}'
  IntakeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Stage}-sruti-public-intake'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt IntakeRole.Arn
      MemorySize: 256
      Timeout: 10
      Tags:
        - Key: Project
          Value: Sadhana
        - Key: Environment
          Value: !Ref Stage
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Environment:
        Variables:
          M91_SRUTI_PUBLIC_INTAKE: !Ref IntakeEnabled
          SADHANA_ENTITY_STAGE: !Ref Stage
          SRUTI_SOURCE_REGISTRATIONS_TABLE: !Ref SourceTableName
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
  IntakeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${IntakeFunction}'
      RetentionInDays: 14
  IntakeApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${Stage}-sadhana-sruti-public-intake'
      Description: 'Public registration intake only - no admin or read endpoints'
      Tags:
        - Key: Project
          Value: Sadhana
        - Key: Environment
          Value: !Ref Stage
      EndpointConfiguration: { Types: [REGIONAL] }
      DisableExecuteApiEndpoint: false
      BinaryMediaTypes: []
  RegistrationResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref IntakeApi
      ParentId: !GetAtt IntakeApi.RootResourceId
      PathPart: register
  RegistrationPost:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: POST
      AuthorizationType: NONE
      ResourceId: !Ref RegistrationResource
      RestApiId: !Ref IntakeApi
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IntakeFunction.Arn}/invocations'
  RegistrationOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      ResourceId: !Ref RegistrationResource
      RestApiId: !Ref IntakeApi
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IntakeFunction.Arn}/invocations'
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [RegistrationPost, RegistrationOptions]
    Properties:
      RestApiId: !Ref IntakeApi
      Description: !Sub '${Stage}-sruti-intake-v1'
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      DeploymentId: !Ref ApiDeployment
      RestApiId: !Ref IntakeApi
      StageName: !Ref Stage
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 2
          MetricsEnabled: true
          LoggingLevel: 'OFF'
          DataTraceEnabled: false
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IntakeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${IntakeApi}/*/*/register'
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${Stage}-sadhana-sruti-intake-waf'
      Scope: REGIONAL
      Tags:
        - Key: Project
          Value: Sadhana
        - Key: Environment
          Value: !Ref Stage
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: SrutiIntakeWebACL
        SampledRequestsEnabled: false
      Rules:
        - Name: PerIpRateLimit
          Priority: 0
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 100
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: SrutiPerIpRateLimit
            SampledRequestsEnabled: false
        - Name: ManagedCommonThreats
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: SrutiCommonThreats
            SampledRequestsEnabled: false
  WebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: [ApiStage]
    Properties:
      ResourceArn: !Sub 'arn:aws:apigateway:${AWS::Region}::/restapis/${IntakeApi}/stages/${ApiStage}'
      WebACLArn: !GetAtt WebACL.Arn
Outputs:
  PublicIntakeUrl:
    Description: Stage-specific public registration POST URL (keep intake disabled until reviewed)
    Value: !Sub 'https://${IntakeApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStage}/register'
  IntakeFunctionName:
    Value: !Ref IntakeFunction
  WebACLArn:
    Value: !GetAtt WebACL.Arn
